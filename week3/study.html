<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>img 태그</h1>
    <img src="https://i.pinimg.com/736x/aa/6e/82/aa6e823a03643986feb5c15d9f533807.jpg" alt="이미지">
    <form>
        <fieldset>
            <legend>회원가입</legend>
            <label for="id">아이디</label>
            <input type="text" id="id" name="id">
            <br>
            <label for="pw">비밀번호</label>
            <input type="password" id="pw" name="pw">
            <br>
            <label for="email">이메일</label>
            <input type="email" id="email" name="email">
            <br>
            <input type="submit" value="가입하기">
            
            <h2>checkBox</h2>
            <label for="1">체크박스1</label>
            <input type="checkbox" id="1" name="1">
            <label for="2">체크박스2</label>
            <input type="checkbox" id="2" name="2">

            <h2>radio</h2>
            <label for="male">라디오1</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="female">라디오2</label>
            <input type="radio" id="female" name="gender" value="female">

            <h2>file</h2>
            <input type="file">

            <h2>기타 폼요소</h2>
            <label for="1">문의 내용</label>
            <textarea id="1"></textarea>

            <label for="2">문의 유형</label>
            <select id="2">
                <option value="1">문의 유형1</option>
                <option value="2" selected>문의 유형2</option>
                <option value="3">문의 유형3</option>
            </select>
        </fieldset>
    </form>
</body>
</html>
