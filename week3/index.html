        <form>
        <fieldset>
            <legend>문의하기</legend>
            <label for="name">이름</label>

            <br>
            <label for="1">문의 내용</label>
            <textarea id="1"></textarea>

            <label for="2">문의 유형</label>
            <select id="2">
                <option value="1">문의 유형1</option>
                <option value="2" selected>문의 유형2</option>
                <option value="3">문의 유형3</option>
            </select>

            <button type="button">버튼</button>
        </fieldset>
    </form>
